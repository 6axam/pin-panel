<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>StreamPad OS: Конфигуратор</title>
    <style>
        :root {
            --bg: #0f0f12;
            --panel: #17171e;
            --accent: #00ff9d;
            --text: #f0f0f5;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--panel);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #262633;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin: 0 0 5px 0;
            color: var(--accent);
            font-size: 24px;
            text-align: center;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111116;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            background: #2a2a3a;
            color: #fff;
        }

        .btn-connect {
            background: var(--accent);
            color: #000;
        }

        .btn-connect:hover {
            background: #00cc7d;
        }

        .btn-save {
            background: var(--accent);
            color: #000;
            width: 100%;
            margin-top: 15px;
        }

        .profile-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #111116;
            padding: 8px;
            border-radius: 6px;
        }

        .prof-btn {
            flex: 1;
            padding: 10px;
            background: #20202b;
            border: 1px solid #303042;
            color: #aaa;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .prof-btn:hover {
            border-color: #444;
            color: #fff;
        }

        .prof-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .pad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 15px;
            margin: 25px 0;
        }

        .pad-btn {
            background: #20202b;
            border: 2px solid #303042;
            border-radius: 10px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .pad-btn:hover {
            border-color: var(--accent);
            background: #252533;
        }

        .pad-btn .title {
            font-weight: bold;
            font-size: 16px;
            color: #fff;
        }

        .pad-btn .sub {
            font-size: 11px;
            color: #777;
            margin-top: 5px;
            text-align: center;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pad-btn.physical-click {
            background: var(--accent) !important;
            color: #000 !important;
            box-shadow: 0 0 25px var(--accent);
            border-color: #fff !important;
            transform: scale(0.96);
        }

        .pad-btn.physical-click * {
            color: #000 !important;
        }

        .pad-btn.configured {
            border-color: #3b5249;
            background: #1a2621;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--panel);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #333;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            color: #aaa;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        select,
        input {
            padding: 10px;
            background: #20202b;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        .input-listen {
            text-align: center;
            background: #111;
            border: 1px dashed var(--accent);
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            padding: 15px;
            border-radius: 6px;
            user-select: none;
        }

        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            background: #111116;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>StreamPad OS Control</h1>

        <div class="status-bar">
            <span id="statusTxt" style="color: #ff4a4a;">Статус: Не подключено</span>
            <button class="btn btn-connect" id="connBtn" onclick="toggleConnection()">Подключить устройство</button>
        </div>

        <div class="profile-selector">
            <button class="prof-btn" id="prof_0" onclick="changeProfile(0)">Пресет 1</button>
            <button class="prof-btn" id="prof_1" onclick="changeProfile(1)">Пресет 2</button>
            <button class="prof-btn" id="prof_2" onclick="changeProfile(2)">Пресет 3</button>
        </div>

        <div class="switch-container">
            <span>Режим привязки (клик на девайсе откроет настройки этой кнопки)</span>
            <input type="checkbox" id="learnToggle" onchange="toggleLearnMode()" disabled
                style="width: 20px; height: 20px;">
        </div>

        <div class="pad-grid" id="padGrid"></div>
    </div>

    <div class="modal" id="bindModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" style="margin-top:0; color:var(--accent);">Настройка кнопки</h3>

            <div class="form-group">
                <label>Тип действия</label>
                <select id="actionType" onchange="switchTypeForm()">
                    <option value="1">Клавиатура (Клавиша/Макрос)</option>
                    <option value="0">Мышь (Клик)</option>
                </select>
            </div>

            <div id="keyboardForm">
                <div class="form-group">
                    <label>Привязанная клавиша</label>
                    <div class="input-listen" id="keyKeyfield" onclick="startKeyListen()">Кликни сюда и нажми клавишу
                    </div>
                </div>
            </div>

            <div id="mouseForm" style="display:none;">
                <div class="form-group">
                    <label>Кнопка мыши</label>
                    <select id="mouseBtnSelect">
                        <option value="1">Левая (ЛКМ)</option>
                        <option value="2">Правая (ПКМ)</option>
                        <option value="3">Средняя (Колёсико)</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-save" onclick="saveActiveBind()">Сохранить бинд</button>
            <button class="btn" style="background:#ff4a4a; color:#000; width:100%; margin-top:8px;"
                onclick="deleteActiveBind()">Удалить бинд</button>
        </div>
    </div>

    <script>
        let port = null;
        let reader = null;
        let buffer = "";

        const MAX_BINDS = 16;
        let localBinds = Array(MAX_BINDS).fill(null).map(() => ({ active: 0, type: 1, modifier: 0, key: 0 }));
        let currentProfile = 0;
        let currentEditingSlot = null;
        let isWaitingForInput = false;
        let capturedKey = 0;
        let capturedMod = 0;

        window.addEventListener('DOMContentLoaded', () => {
            renderGrid();
            window.addEventListener('keydown', handleGlobalKeydown);
            updateProfileUI();
        });

        function renderGrid() {
            const grid = document.getElementById("padGrid");
            grid.innerHTML = "";
            for (let i = 0; i < MAX_BINDS; i++) {
                const btn = document.createElement("div");
                btn.className = "pad-btn";
                btn.id = `pad_btn_${i}`;
                btn.onclick = () => {
                    if (!document.getElementById("learnToggle").checked) openModal(i);
                };

                const title = document.createElement("span");
                title.className = "title";
                title.innerText = `B${i + 1}`;

                const sub = document.createElement("span");
                sub.className = "sub";
                sub.id = `pad_sub_${i}`;
                sub.innerText = "Пусто";

                btn.appendChild(title);
                btn.appendChild(sub);
                grid.appendChild(btn);
            }
        }

        function updateGridVisuals() {
            for (let i = 0; i < MAX_BINDS; i++) {
                const btn = document.getElementById(`pad_btn_${i}`);
                const sub = document.getElementById(`pad_sub_${i}`);
                if (!btn || !sub) continue;

                if (localBinds[i] && localBinds[i].active === 1) {
                    btn.classList.add("configured");
                    if (localBinds[i].type === 1) {
                        let modStr = "";
                        if (localBinds[i].modifier & 1) modStr += "CTRL+";
                        if (localBinds[i].modifier & 2) modStr += "SHIFT+";
                        if (localBinds[i].modifier & 4) modStr += "ALT+";
                        if (localBinds[i].modifier & 8) modStr += "WIN+";

                        const keyChar = localBinds[i].key > 32 && localBinds[i].key < 127 ? String.fromCharCode(localBinds[i].key) : `Code ${localBinds[i].key}`;
                        sub.innerText = modStr + keyChar;
                    } else {
                        const mButtons = { 1: "ЛКМ", 2: "ПКМ", 3: "СКМ" };
                        sub.innerText = mButtons[localBinds[i].key] || "Клик";
                    }
                } else {
                    btn.classList.remove("configured");
                    sub.innerText = "Пусто";
                }
            }
        }

        function updateProfileUI() {
            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`prof_${i}`);
                if (btn) {
                    if (i === currentProfile) btn.classList.add("active");
                    else btn.classList.remove("active");
                }
            }
        }

        async function changeProfile(profId) {
            if (!port) return;
            currentProfile = profId;
            updateProfileUI();
            await sendToESP(`SET_PROFILE=${profId}\n`);
        }

        async function toggleConnection() {
            if (port) await disconnect();
            else await connectSerial();
        }

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                updateStatus(true);
                await sendToESP("GET_BINDS\n");
                readLoop();
            } catch (err) {
                console.error(err);
                updateStatus(false);
            }
        }

        async function sendToESP(txt) {
            if (!port || !port.writable) return;
            const writer = port.writable.getWriter();
            try {
                await writer.write(new TextEncoder().encode(txt));
            } catch (err) {
                handleDisconnect();
            } finally {
                writer.releaseLock();
            }
        }

        async function autoConnect() {
            try {
                const availablePorts = await navigator.serial.getPorts();
                if (availablePorts.length === 0) return false;
                for (const p of availablePorts) {
                    try {
                        await p.open({ baudRate: 115200 });
                        const writer = p.writable.getWriter();
                        await writer.write(new TextEncoder().encode("PING_PAD\n"));
                        writer.releaseLock();

                        const readerTemp = p.readable.getReader();
                        const { value, done } = await Promise.race([
                            readerTemp.read(),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 150))
                        ]);
                        const response = new TextDecoder().decode(value);
                        readerTemp.releaseLock();

                        if (response.includes("PONG_PAD")) {
                            port = p;
                            updateStatus(true);
                            await sendToESP("GET_BINDS\n");
                            readLoop();
                            return true;
                        } else {
                            await p.close();
                        }
                    } catch (e) {
                        try { await p.close(); } catch (err) { }
                    }
                }
            } catch (globalErr) { }
            return false;
        }

        async function readLoop() {
            const dec = new TextDecoderStream();
            const pipeClosed = port.readable.pipeTo(dec.writable);
            reader = dec.readable.getReader();
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += value;
                    let lines = buffer.split('\n');
                    buffer = lines.pop();
                    lines.forEach(l => {
                        l = l.trim();
                        if (!l) return;
                        parseIncomingLine(l);
                    });
                }
            } catch (err) {
                handleDisconnect();
            }
        }

        function parseIncomingLine(line) {
            console.log("RX:", line);

            if (line.startsWith("CLICK_B=")) {
                const btnId = parseInt(line.substring(8));
                animatePhysicalClick(btnId);

                if (document.getElementById("learnToggle").checked) {
                    openModal(btnId);
                }
            }

            if (line.startsWith("CURRENT_PROFILE=")) {
                currentProfile = parseInt(line.substring(16));
                updateProfileUI();
            }

            if (line.startsWith("BIND=")) {
                const parts = line.substring(5).split(',');
                if (parts.length >= 5) {
                    const slot = parseInt(parts[0]);
                    if (slot >= 0 && slot < MAX_BINDS) {
                        localBinds[slot] = {
                            active: parseInt(parts[1]),
                            type: parseInt(parts[2]),
                            modifier: parseInt(parts[3]),
                            key: parseInt(parts[4])
                        };
                        updateGridVisuals();
                    }
                }
            }

            if (line.startsWith("DEL_OK=")) {
                const slot = parseInt(line.substring(7));
                if (slot >= 0 && slot < MAX_BINDS) {
                    localBinds[slot] = { active: 0, type: 1, modifier: 0, key: 0 };
                    updateGridVisuals();
                }
            }
        }

        function animatePhysicalClick(btnId) {
            const btn = document.getElementById(`pad_btn_${btnId}`);
            if (!btn) return;
            btn.classList.add("physical-click");
            setTimeout(() => {
                btn.classList.remove("physical-click");
            }, 150);
        }

        async function handleDisconnect() {
            if (reader) {
                try { await reader.cancel(); } catch (e) { }
                reader = null;
            }
            if (port) {
                try { await port.close(); } catch (e) { }
                port = null;
            }
            updateStatus(false);
        }

        async function disconnect() {
            await handleDisconnect();
        }

        function updateStatus(isConnected) {
            const statusTxt = document.getElementById("statusTxt");
            const connBtn = document.getElementById("connBtn");
            const learnToggle = document.getElementById("learnToggle");

            if (isConnected) {
                statusTxt.innerText = "Статус: Подключено";
                statusTxt.style.color = "#00ff9d";
                connBtn.innerText = "Отключить устройство";
                connBtn.style.background = "#ff4a4a";
                learnToggle.disabled = false;
            } else {
                statusTxt.innerText = "Статус: Не подключено";
                statusTxt.style.color = "#ff4a4a";
                connBtn.innerText = "Подключить устройство";
                connBtn.style.background = "var(--accent)";
                learnToggle.disabled = true;
                learnToggle.checked = false;
            }
        }

        async function toggleLearnMode() {
            const toggle = document.getElementById("learnToggle");
            if (toggle.checked) await sendToESP("LEARN_ON\n");
            else await sendToESP("LEARN_OFF\n");
        }

        function openModal(slot) {
            currentEditingSlot = slot;
            isWaitingForInput = false;
            document.getElementById("modalTitle").innerText = `Настройка кнопки B${slot + 1}`;
            const bind = localBinds[slot];
            if (bind && bind.active === 1) {
                document.getElementById("actionType").value = bind.type;
                if (bind.type === 1) {
                    capturedKey = bind.key;
                    capturedMod = bind.modifier;
                    document.getElementById("keyKeyfield").innerText = `Код: ${bind.key} (Мод: ${bind.modifier})`;
                } else {
                    document.getElementById("mouseBtnSelect").value = bind.key;
                }
            } else {
                document.getElementById("actionType").value = "1";
                document.getElementById("keyKeyfield").innerText = "Кликни сюда и нажми клавишу";
                document.getElementById("mouseBtnSelect").value = "1";
                capturedKey = 0;
                capturedMod = 0;
            }
            switchTypeForm();
            document.getElementById("bindModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("bindModal").style.display = "none";
            isWaitingForInput = false;
            currentEditingSlot = null;
        }

        function switchTypeForm() {
            const type = document.getElementById("actionType").value;
            if (type === "1") {
                document.getElementById("keyboardForm").style.display = "block";
                document.getElementById("mouseForm").style.display = "none";
            } else {
                document.getElementById("keyboardForm").style.display = "none";
                document.getElementById("mouseForm").style.display = "block";
            }
        }

        function startKeyListen() {
            isWaitingForInput = true;
            const field = document.getElementById("keyKeyfield");
            field.innerText = "ОЖИДАНИЕ НАЖАТИЯ...";
            field.style.borderColor = "#ffaa00";
            field.style.color = "#ffaa00";
        }

        function handleGlobalKeydown(e) {
            // Переменная, которая будет намертво блокировать клавиатуру для браузера
            let isWaitingForInput = false;
            let capturedKey = 0;
            let capturedMod = 0;

            // 1. ПОЛНЫЙ ПАРАЛИЧ КЛАВИАТУРЫ НА САЙТЕ
            // Этот обработчик вешается в режиме capture (третий аргумент true) 
            // и полностью перехватывает любые нажатия до того, как их услышит сайт или браузер
            window.addEventListener('keydown', function (e) {
                if (isWaitingForInput) {
                    // Если сайт ждет бинд — гасим стандартное поведение браузера (поиск, закрытие, копирование)
                    e.preventDefault();
                    e.stopPropagation();

                    // Передаем управление нашей функции разбора
                    processCapturedKey(e);
                }
            }, true); // true — это критически важно, это режим перехвата (Capture)

            window.addEventListener('keyup', function (e) {
                if (isWaitingForInput) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);

            window.addEventListener('keypress', function (e) {
                if (isWaitingForInput) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);


            // 2. ФУНКЦИЯ РАЗБОРА И ЗАПИСИ КЛАВИШИ
            function processCapturedKey(e) {
                const modifiers = ["Control", "Shift", "Alt", "Meta"];

                // Если нажат только Ctrl/Shift сам по себе — игнорим и ждем дальше букву
                if (modifiers.includes(e.key)) {
                    return;
                }

                let mod = 0;
                if (e.ctrlKey) mod |= 1;
                if (e.shiftKey) mod |= 2;
                if (e.altKey) mod |= 4;
                if (e.metaKey) mod |= 8;

                capturedKey = e.keyCode;
                capturedMod = mod;

                let keyName = e.key.toUpperCase();
                if (e.code === "Space") keyName = "SPACE";

                let modStr = "";
                if (mod & 1) modStr += "CTRL+";
                if (mod & 2) modStr += "SHIFT+";
                if (mod & 4) modStr += "ALT+";
                if (mod & 8) modStr += "WIN+";

                const field = document.getElementById("keyKeyfield");
                field.innerText = `Нажато: ${modStr}${keyName} (Мод: ${mod})`;
                field.style.borderColor = "var(--accent)";
                field.style.color = "var(--accent)";

                // ВАЖНО: Мы НЕ выключаем isWaitingForInput сразу здесь! 
                // Даем пользователю посмотреть, что он нажал. 
                // Логика выключится, когда он нажмет "Сохранить" или закроет модалку.
            }

            // 3. ОБНОВИ ФУНКЦИИ МОДАЛКИ (Чтобы вовремя включать и выключать паралич)
            function openModal(slotId) {
                currentEditingSlot = slotId;
                capturedKey = 0;
                capturedMod = 0;

                // Сбрасываем поле ввода
                const field = document.getElementById("keyKeyfield");
                field.innerText = "Кликните сюда и нажмите клавишу...";
                field.style.borderColor = "#262633";
                field.style.color = "var(--text)";

                document.getElementById("customModal").style.display = "flex";

                // Переводим сайт в режим тотальной изоляции клавиатуры
                isWaitingForInput = true;
                sendToESP("LEARN_ON\n"); // Отправляем на плату, если нужно
            }

            function closeModal() {
                document.getElementById("customModal").style.display = "none";

                // Возвращаем клавиатуру в нормальный рабочий режим
                isWaitingForInput = false;
                currentEditingSlot = null;
                sendToESP("LEARN_OFF\n");
            }
        }

        async function saveActiveBind() {
            if (currentEditingSlot === null) return;
            const type = parseInt(document.getElementById("actionType").value);
            let mod = 0, key = 0;

            if (type === 1) {
                if (capturedKey === 0) { return; }
                key = capturedKey; mod = capturedMod;
            } else {
                key = parseInt(document.getElementById("mouseBtnSelect").value);
            }

            const cmd = `SET_B=${currentEditingSlot},${type},${mod},${key}\n`;
            await sendToESP(cmd);
            localBinds[currentEditingSlot] = { active: 1, type, modifier: mod, key };
            updateGridVisuals();
            closeModal();
        }

        async function deleteActiveBind() {
            if (currentEditingSlot === null) return;
            const cmd = `DEL_B=${currentEditingSlot}\n`;
            await sendToESP(cmd);
            closeModal();
        }

        window.addEventListener('load', async () => {
            await autoConnect();
        });
    </script>
</body>

</html>
